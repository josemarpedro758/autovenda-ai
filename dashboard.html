<!DOCTYPE html>
<html lang="pt">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AutoVenda IA Dashboard</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}

.sidebar{

width:250px;
height:100vh;
background:#111827;
position:fixed;
left:0;
top:0;
padding:20px;

}

.sidebar h1{

font-size:24px;
margin-bottom:40px;

}

.sidebar button{

width:100%;
padding:15px;
margin-top:10px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
cursor:pointer;

}

.main{

margin-left:270px;
padding:20px;

}

.cards{

display:grid;
grid-template-columns:
repeat(auto-fit,minmax(250px,1fr));

gap:20px;
margin-bottom:30px;

}

.card{

background:#1e293b;
padding:20px;
border-radius:15px;

}

.card h2{

margin:0;
font-size:18px;

}

.card p{

font-size:32px;
margin-top:10px;
font-weight:bold;

}

.section{

background:#1e293b;
padding:20px;
border-radius:15px;
margin-bottom:20px;

}

.product,
.client{

background:#334155;
padding:15px;
border-radius:12px;
margin-top:15px;

}

img{

width:100px;
border-radius:10px;
margin-top:10px;

}

</style>

</head>

<body>

<div class="sidebar">

<h1>AutoVenda IA 🚀</h1>

<button onclick="logout()">
Sair
</button>

</div>

<div class="main">

<div class="cards">

<div class="card">

<h2>Total Produtos</h2>

<p id="totalProducts">0</p>

</div>

<div class="card">

<h2>Total Clientes</h2>

<p id="totalClients">0</p>

</div>

</div>

<div class="section">

<h2>Produtos</h2>

<div id="products"></div>

</div>

<div class="section">

<h2>Clientes</h2>

<div id="clients"></div>

</div>

</div>

<script>

const API_URL =
"https://autovenda-ai.onrender.com";

const token =
localStorage.getItem("token");

if(!token){

window.location.href =
"/login.html";

}

async function loadProducts(){

const response = await fetch(

API_URL + "/admin/products",

{
headers:{
Authorization:
"Bearer " + token
}
}

);

const products =
await response.json();

document.getElementById(
"totalProducts"
).innerText =
products.length;

const productsDiv =
document.getElementById(
"products"
);

productsDiv.innerHTML = "";

products.forEach(product=>{

productsDiv.innerHTML += `

<div class="product">

<h3>${product.name}</h3>

<p>${product.price}</p>

<p>${product.description}</p>

<img src="${product.image}" />

</div>

`;

});

}

async function loadClients(){

const response = await fetch(

API_URL + "/admin/clients",

{
headers:{
Authorization:
"Bearer " + token
}
}

);

const clients =
await response.json();

document.getElementById(
"totalClients"
).innerText =
clients.length;

const clientsDiv =
document.getElementById(
"clients"
);

clientsDiv.innerHTML = "";

clients.forEach(client=>{

clientsDiv.innerHTML += `

<div class="client">

<p>
<strong>Número:</strong>
${client.number}
</p>

<p>
<strong>Última mensagem:</strong>
${client.lastMessage}
</p>

</div>

`;

});

}

function logout(){

localStorage.removeItem(
"token"
);

window.location.href =
"/login.html";

}

loadProducts();
loadClients();

</script>

</body>
</html>
