<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard • AutoVenda IA</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{

display:flex;

background:
linear-gradient(
135deg,
#020617,
#0f172a,
#111827
);

color:white;

min-height:100vh;

overflow-x:hidden;

}

.sidebar{

width:280px;

background:
rgba(255,255,255,0.05);

backdrop-filter:blur(20px);

border-right:
1px solid rgba(255,255,255,0.06);

padding:30px;

}

.logo{

font-size:32px;

font-weight:900;

margin-bottom:50px;

background:
linear-gradient(
90deg,
#7c3aed,
#06b6d4,
#00ffbf
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

}

.menu{

display:flex;
flex-direction:column;
gap:15px;

}

.menu a{

text-decoration:none;

color:#cbd5e1;

padding:16px;

border-radius:18px;

transition:0.3s;

font-weight:700;

}

.menu a:hover{

background:
rgba(255,255,255,0.08);

color:white;

transform:translateX(5px);

}

.main{

flex:1;

padding:35px;

}

.topbar{

display:flex;
justify-content:space-between;
align-items:center;

margin-bottom:35px;

}

.topbar h1{

font-size:42px;

font-weight:900;

}

.topbar p{

color:#94a3b8;

margin-top:10px;

}

.top-actions{

display:flex;
gap:15px;

}

.button{

border:none;

padding:15px 24px;

border-radius:18px;

font-weight:800;

cursor:pointer;

transition:0.3s;

}

.primary{

background:
linear-gradient(
90deg,
#7c3aed,
#06b6d4
);

color:white;

}

.secondary{

background:
rgba(255,255,255,0.08);

color:white;

}

.button:hover{

transform:translateY(-4px);

}

.cards{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(240px,1fr));

gap:25px;

margin-bottom:35px;

}

.card{

background:
rgba(255,255,255,0.05);

padding:30px;

border-radius:28px;

border:
1px solid rgba(255,255,255,0.06);

backdrop-filter:blur(20px);

transition:0.3s;

}

.card:hover{

transform:translateY(-6px);

}

.card h3{

color:#94a3b8;

margin-bottom:15px;

}

.card h2{

font-size:42px;

font-weight:900;

}

.grid{

display:grid;

grid-template-columns:2fr 1fr;

gap:28px;

margin-bottom:35px;

}

.box{

background:
rgba(255,255,255,0.05);

padding:28px;

border-radius:30px;

border:
1px solid rgba(255,255,255,0.06);

backdrop-filter:blur(20px);

}

.box h2{

margin-bottom:25px;

}

.product{

display:flex;
justify-content:space-between;
align-items:center;

padding:18px 0;

border-bottom:
1px solid rgba(255,255,255,0.06);

}

.product:last-child{

border:none;

}

.product-left{

display:flex;
gap:15px;
align-items:center;

}

.product img{

width:60px;
height:60px;

border-radius:18px;

object-fit:cover;

}

.price{

font-weight:900;

color:#00ffbf;

}

.messages{

max-height:400px;

overflow-y:auto;

}

.message{

background:
rgba(255,255,255,0.05);

padding:18px;

border-radius:18px;

margin-bottom:18px;

}

.form{

margin-top:30px;

display:grid;

gap:15px;

}

.input{

padding:18px;

border:none;

border-radius:18px;

background:
rgba(255,255,255,0.08);

color:white;

outline:none;

}

.select{

padding:18px;

border:none;

border-radius:18px;

background:
rgba(255,255,255,0.08);

color:white;

outline:none;

}

@media(max-width:1100px){

body{

flex-direction:column;

}

.sidebar{

width:100%;

}

.grid{

grid-template-columns:1fr;

}

}

</style>

</head>

<body>

<div class="sidebar">

<div class="logo">
🚀 AutoVenda IA
</div>

<div class="menu">

<a href="#">
🏠 Dashboard
</a>

<a href="#">
📦 Produtos
</a>

<a href="#">
💬 Conversas
</a>

<a href="#">
📈 Analytics
</a>

<a href="#">
🤖 IA Inteligente
</a>

<a href="#">
⚙️ Configurações
</a>

</div>

</div>

<div class="main">

<div class="topbar">

<div>

<h1>
📊 Dashboard Premium
</h1>

<p>
Painel global inteligente em tempo real
</p>

</div>

<div class="top-actions">

<button class="button secondary">
🌍 Global
</button>

<button class="button primary">
🚀 AutoVenda IA
</button>

</div>

</div>

<div class="cards">

<div class="card">

<h3>
💰 Receita
</h3>

<h2 id="revenue">
0
</h2>

</div>

<div class="card">

<h3>
📦 Produtos
</h3>

<h2 id="products">
0
</h2>

</div>

<div class="card">

<h3>
👥 Clientes
</h3>

<h2 id="clients">
0
</h2>

</div>

<div class="card">

<h3>
💬 Conversas
</h3>

<h2 id="messages">
0
</h2>

</div>

</div>

<div class="grid">

<div class="box">

<h2>
📈 Analytics
</h2>

<canvas id="chart"></canvas>

</div>

<div class="box">

<h2>
🔥 Produtos Recentes
</h2>

<div id="recentProducts">

</div>

</div>

</div>

<div class="grid">

<div class="box">

<h2>
📦 Adicionar Produto
</h2>

<div class="form">

<input
type="text"
placeholder="Nome produto"
id="name"
class="input"
>

<input
type="text"
placeholder="Preço"
id="price"
class="input"
>

<input
type="text"
placeholder="Descrição"
id="description"
class="input"
>

<select id="type" class="select">

<option value="fisico">
Produto Físico
</option>

<option value="digital">
Produto Digital
</option>

</select>

<input
type="file"
id="image"
class="input"
>

<button
class="button primary"
onclick="createProduct()"
>
🚀 Salvar Produto
</button>

</div>

</div>

<div class="box">

<h2>
💬 Conversas Tempo Real
</h2>

<div
class="messages"
id="messagesBox"
>

</div>

</div>

</div>

</div>

<script>

const token =
localStorage.getItem("token");

if(!token){

window.location.href =
"/login";

}

const socket = io();

socket.on(
"new-message",
(data)=>{

document.getElementById(
"messagesBox"
).innerHTML += `

<div class="message">

<strong>
Cliente:
</strong>

${data.message}

<br><br>

<strong>
IA:
</strong>

${data.response}

</div>

`;

}
);

socket.on(
"new-product",
(product)=>{

loadAnalytics();

}
);

async function loadAnalytics(){

const response =
await fetch(
"/admin/analytics",
{
headers:{
Authorization:
`Bearer ${token}`
}
}
);

const data =
await response.json();

document.getElementById(
"revenue"
).innerText =
"$" + data.revenue;

document.getElementById(
"products"
).innerText =
data.products;

document.getElementById(
"clients"
).innerText =
data.clients;

document.getElementById(
"messages"
).innerText =
data.messages;

const products =
document.getElementById(
"recentProducts"
);

products.innerHTML = "";

data.recentProducts.forEach(product=>{

products.innerHTML += `

<div class="product">

<div class="product-left">

<img src="${product.image}">

<div>

<h4>
${product.name}
</h4>

<p>
${product.description}
</p>

</div>

</div>

<div class="price">

${product.price}

</div>

</div>

`;

});

const ctx =
document.getElementById(
"chart"
);

new Chart(ctx,{

type:"line",

data:{

labels:[
"Jan",
"Fev",
"Mar",
"Abr",
"Mai",
"Jun",
"Jul"
],

datasets:[{

label:"Vendas",

data:[
120,
300,
450,
600,
900,
1200,
1600
],

borderWidth:4,

tension:0.4

}]

}

});

}

async function createProduct(){

const name =
document.getElementById(
"name"
).value;

const price =
document.getElementById(
"price"
).value;

const description =
document.getElementById(
"description"
).value;

const type =
document.getElementById(
"type"
).value;

const imageFile =
document.getElementById(
"image"
).files[0];

const formData =
new FormData();

formData.append(
"image",
imageFile
);

const uploadResponse =
await fetch(
"/upload-image",
{
method:"POST",
body:formData
}
);

const uploadData =
await uploadResponse.json();

await fetch(
"/admin/products",
{

method:"POST",

headers:{
"Content-Type":
"application/json",

Authorization:
`Bearer ${token}`
},

body:JSON.stringify({

name,
price,
description,
type,

image:
uploadData.url

})

}
);

loadAnalytics();

alert(
"Produto criado 🚀"
);

}

loadAnalytics();

</script>

</body>
</html>
