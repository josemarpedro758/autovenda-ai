<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard • AutoVenda IA</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="/socket.io/socket.io.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{

background:
linear-gradient(
135deg,
#020617,
#0f172a,
#111827
);

color:white;

min-height:100vh;

overflow-x:hidden;

}

/* =========================
SIDEBAR
========================= */

.sidebar{

position:fixed;

left:0;
top:0;

width:280px;
height:100vh;

background:
rgba(255,255,255,0.04);

border-right:
1px solid rgba(255,255,255,0.06);

backdrop-filter:blur(25px);

padding:35px 25px;

}

.logo{

font-size:32px;

font-weight:900;

margin-bottom:50px;

background:
linear-gradient(
90deg,
#7c3aed,
#06b6d4,
#00ffbf
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

}

.menu{

display:flex;

flex-direction:column;

gap:16px;

}

.menu button{

padding:18px;

border:none;

border-radius:18px;

background:
rgba(255,255,255,0.05);

border:
1px solid rgba(255,255,255,0.06);

color:white;

font-weight:700;

cursor:pointer;

transition:0.3s;

text-align:left;

font-size:15px;

}

.menu button:hover{

transform:translateX(6px);

background:
linear-gradient(
90deg,
#7c3aed,
#06b6d4
);

}

/* =========================
MAIN
========================= */

.main{

margin-left:280px;

padding:40px;

}

.topbar{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:40px;

}

.title{

font-size:42px;

font-weight:900;

}

.subtitle{

color:#94a3b8;

margin-top:8px;

}

.status{

padding:14px 20px;

border-radius:999px;

background:
rgba(0,255,170,0.1);

border:
1px solid rgba(0,255,170,0.2);

color:#00ffbf;

font-weight:700;

}

/* =========================
CARDS
========================= */

.cards{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(260px,1fr));

gap:25px;

margin-bottom:40px;

}

.card{

background:
rgba(255,255,255,0.05);

border:
1px solid rgba(255,255,255,0.06);

padding:30px;

border-radius:28px;

backdrop-filter:blur(20px);

transition:0.3s;

}

.card:hover{

transform:translateY(-6px);

}

.card-icon{

font-size:42px;

margin-bottom:20px;

}

.card-title{

color:#94a3b8;

margin-bottom:10px;

}

.card-value{

font-size:42px;

font-weight:900;

}

/* =========================
GRID
========================= */

.grid{

display:grid;

grid-template-columns:2fr 1fr;

gap:25px;

margin-bottom:40px;

}

.panel{

background:
rgba(255,255,255,0.05);

border:
1px solid rgba(255,255,255,0.06);

border-radius:30px;

padding:30px;

backdrop-filter:blur(20px);

}

.panel-title{

font-size:24px;

font-weight:800;

margin-bottom:25px;

}

/* =========================
FORM
========================= */

.form{

display:flex;

flex-direction:column;

gap:18px;

}

.input{

padding:18px;

border:none;

border-radius:18px;

background:
rgba(255,255,255,0.06);

border:
1px solid rgba(255,255,255,0.06);

color:white;

font-size:15px;

outline:none;

}

.input::placeholder{

color:#94a3b8;

}

.upload-btn{

padding:18px;

border:none;

border-radius:20px;

font-weight:800;

font-size:16px;

cursor:pointer;

background:
linear-gradient(
90deg,
#7c3aed,
#06b6d4
);

color:white;

transition:0.3s;

}

.upload-btn:hover{

transform:translateY(-4px);

}

/* =========================
PRODUCTS
========================= */

.products{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(260px,1fr));

gap:22px;

margin-top:25px;

}

.product{

background:
rgba(255,255,255,0.04);

border:
1px solid rgba(255,255,255,0.06);

border-radius:24px;

overflow:hidden;

transition:0.3s;

}

.product:hover{

transform:translateY(-6px);

}

.product img{

width:100%;
height:220px;

object-fit:cover;

}

.product-content{

padding:22px;

}

.product-name{

font-size:22px;

font-weight:800;

margin-bottom:10px;

}

.product-price{

font-size:28px;

font-weight:900;

color:#00ffbf;

margin-bottom:14px;

}

.product-desc{

color:#94a3b8;

line-height:1.7;

margin-bottom:18px;

}

.product-type{

display:inline-block;

padding:10px 16px;

border-radius:999px;

background:
rgba(124,58,237,0.2);

font-size:13px;

font-weight:700;

}

/* =========================
MESSAGES
========================= */

.messages{

display:flex;

flex-direction:column;

gap:18px;

max-height:550px;

overflow:auto;

}

.message{

background:
rgba(255,255,255,0.04);

border:
1px solid rgba(255,255,255,0.06);

padding:20px;

border-radius:22px;

}

.message-number{

font-size:14px;

color:#06b6d4;

margin-bottom:10px;

font-weight:700;

}

.message-user{

margin-bottom:12px;

color:#cbd5e1;

}

.message-ai{

color:#00ffbf;

line-height:1.7;

}

/* =========================
RESPONSIVE
========================= */

@media(max-width:1100px){

.sidebar{

display:none;

}

.main{

margin-left:0;

}

.grid{

grid-template-columns:1fr;

}

}

@media(max-width:700px){

.main{

padding:25px;

}

.title{

font-size:32px;

}

}

</style>

</head>

<body>

<div class="sidebar">

<div class="logo">
🚀 AutoVenda IA
</div>

<div class="menu">

<button>
📊 Dashboard
</button>

<button>
🛍 Produtos
</button>

<button>
🤖 IA
</button>

<button>
📈 Analytics
</button>

<button>
💬 Conversas
</button>

<button onclick="logout()">
🚪 Sair
</button>

</div>

</div>

<div class="main">

<div class="topbar">

<div>

<div class="title">
Dashboard Premium
</div>

<div class="subtitle">
Painel global inteligente • Tempo real
</div>

</div>

<div class="status">
🟢 Sistema Online
</div>

</div>

<div class="cards">

<div class="card">

<div class="card-icon">
🛍
</div>

<div class="card-title">
Produtos
</div>

<div class="card-value" id="productsCount">
0
</div>

</div>

<div class="card">

<div class="card-icon">
👥
</div>

<div class="card-title">
Clientes
</div>

<div class="card-value" id="clientsCount">
0
</div>

</div>

<div class="card">

<div class="card-icon">
💬
</div>

<div class="card-title">
Mensagens
</div>

<div class="card-value" id="messagesCount">
0
</div>

</div>

<div class="card">

<div class="card-icon">
💰
</div>

<div class="card-title">
Receita
</div>

<div class="card-value" id="revenueCount">
0$
</div>

</div>

</div>

<div class="grid">

<div class="panel">

<div class="panel-title">
📈 Analytics Global
</div>

<canvas id="chart"></canvas>

</div>

<div class="panel">

<div class="panel-title">
🚀 Novo Produto
</div>

<div class="form">

<input
type="text"
id="name"
class="input"
placeholder="Nome produto"
>

<input
type="text"
id="price"
class="input"
placeholder="Preço"
>

<textarea
id="description"
class="input"
placeholder="Descrição"
></textarea>

<select
id="type"
class="input"
>

<option value="fisico">
Produto físico
</option>

<option value="digital">
Produto digital
</option>

</select>

<input
type="file"
id="image"
class="input"
>

<button
class="upload-btn"
onclick="createProduct()"
>
🚀 Publicar Produto
</button>

</div>

</div>

</div>

<div class="panel">

<div class="panel-title">
🛍 Produtos Publicados
</div>

<div class="products" id="products">
</div>

</div>

<br>

<div class="panel">

<div class="panel-title">
💬 Conversas em Tempo Real
</div>

<div class="messages" id="messages">
</div>

 <br>

<div class="panel">

<div class="panel-title">
👥 Clientes
</div>

<div id="clientsList"></div>

</div>
 <br>

<div class="panel">

<div class="panel-title">
👥 Clientes
</div>
 
<input
type="text"
id="searchClient"
class="input"
placeholder="🔍 Procurar cliente..."
onkeyup="filterClients()"
>

<br><br>

<div id="clients">
</div>

<br>

<div class="panel">

<div class="panel-title">
📨 Histórico de Conversas
</div>

<div
id="messagesHistory"
class="messages"
>
</div>

</div> 

<script>

const token =
localStorage.getItem("token");

if(!token){

window.location.href =
"/login";

}

const socket = io();

socket.on(
"new-product",
()=>{
loadProducts();
loadAnalytics();
}
);

socket.on(
"new-message",
(data)=>{

const messages =
document.getElementById(
"messages"
);

messages.innerHTML =

`
<div class="message">

<div class="message-number">
${data.number}
</div>

<div class="message-user">
👤 ${data.message}
</div>

<div class="message-ai">
🤖 ${data.response}
</div>

</div>
`

+ messages.innerHTML;

loadAnalytics();

}
);

/* =========================
ANALYTICS
========================= */

async function loadAnalytics(){

const response =
await fetch(
"/admin/analytics",
{
headers:{
Authorization:
`Bearer ${token}`
}
}
);

const data =
await response.json();

document.getElementById(
"productsCount"
).innerText =
data.products;

document.getElementById(
"clientsCount"
).innerText =
data.clients;

document.getElementById(
"messagesCount"
).innerText =
data.messages;

document.getElementById(
"revenueCount"
).innerText =
"$" + data.revenue;

createChart(data);

}

function createChart(data){

const ctx =
document.getElementById(
"chart"
);

new Chart(ctx,{

type:"line",

data:{

labels:[
"Produtos",
"Clientes",
"Mensagens",
"Receita"
],

datasets:[{

label:"Analytics",

data:[
data.products,
data.clients,
data.messages,
data.revenue
],

borderWidth:4,

tension:0.4

}]

},

options:{
responsive:true
}

});

}

/* =========================
LOAD PRODUCTS
========================= */

async function loadProducts(){

const response =
await fetch(
"/admin/products",
{
headers:{
Authorization:
`Bearer ${token}`
}
}
);

const products =
await response.json();

const productsDiv =
document.getElementById(
"products"
);

productsDiv.innerHTML = "";

products.forEach(product=>{

productsDiv.innerHTML +=

`
<div class="product">

<img src="${product.image}">

<div class="product-content">

<div class="product-name">
${product.name}
</div>

<div class="product-price">
${product.price}
</div>

<div class="product-desc">
${product.description}
</div>

<div class="product-type">
${product.type}
</div>

<br><br>

<br><br>

<button
onclick="editProduct(${product.id})"
style="
padding:10px 15px;
border:none;
border-radius:12px;
cursor:pointer;
font-weight:700;
background:#3b82f6;
color:white;
margin-right:8px;
"
>
✏️ Editar
</button>

<button
onclick="deleteProduct(${product.id})"
style="
padding:10px 15px;
border:none;
border-radius:12px;
cursor:pointer;
font-weight:700;
background:#ef4444;
color:white;
"
>
🗑️ Excluir
</button>

</div>

</div>
`;

});

}

/* =========================
CREATE PRODUCT
========================= */

async function createProduct(){

const name =
document.getElementById(
"name"
).value;

const price =
document.getElementById(
"price"
).value;

const description =
document.getElementById(
"description"
).value;

const type =
document.getElementById(
"type"
).value;

const imageFile =
document.getElementById(
"image"
).files[0];

if(
!name ||
!price ||
!description ||
!imageFile
){

return alert(
"Preencha tudo"
);

}

const formData =
new FormData();

formData.append(
"image",
imageFile
);

const uploadResponse =
await fetch(
"/upload-image",
{
method:"POST",
body:formData
}
);

const uploadData =
await uploadResponse.json();

await fetch(
"/admin/products",
{

method:"POST",

headers:{
"Content-Type":
"application/json",

Authorization:
`Bearer ${token}`
},

body:JSON.stringify({

name,
price,
description,
type,

image:
uploadData.url

})

}
);

alert(
"Produto publicado 🚀"
);

loadProducts();

loadAnalytics();

}

/* =========================
LOGOUT
========================= */

function logout(){

localStorage.removeItem(
"token"
);

window.location.href =
"/login";

}
async function editProduct(id){

  const novoNome =
  prompt("Novo nome:");

  if(!novoNome){
    return;
  }

  const novoPreco =
  prompt("Novo preço:");

  const novaDescricao =
  prompt("Nova descrição:");

  const novoTipo =
  prompt(
    "Tipo (fisico ou digital):"
  );

  await fetch(

    `/admin/products/${id}`,

    {

      method:"PUT",

      headers:{

        "Content-Type":
        "application/json",

        Authorization:
        `Bearer ${token}`

      },

      body:JSON.stringify({

        name:novoNome,
        price:novoPreco,
        description:novaDescricao,
        type:novoTipo

      })

    }

  );
  
loadProducts();

loadAnalytics();

}
async function deleteProduct(id){

  const confirmar =
  confirm(
    "Deseja excluir este produto?"
  );

  if(!confirmar){
    return;
  }

  await fetch(

    `/admin/products/${id}`,

    {
      method:"DELETE",

      headers:{
        Authorization:
        `Bearer ${token}`
      }
    }

  );

  loadProducts();

  loadAnalytics();

}
    async function loadMessagesHistory(){

  const response =
  await fetch(

    "/admin/messages",

    {

      headers:{
        Authorization:
        `Bearer ${token}`
      }

    }

  );

  const data =
  await response.json();

  const historyDiv =
  document.getElementById(
    "messagesHistory"
  );

  historyDiv.innerHTML = "";

  data.messages.forEach(msg=>{

    historyDiv.innerHTML +=

    `
    <div class="message">

      <div class="message-number">

      📱 ${msg.number}

      </div>

      <div class="message-user">

      👤 ${msg.message}

      </div>

      <div class="message-ai">

      🤖 ${msg.response}

      </div>

    </div>
    `;

  });

}

 async function loadClients(){

  const response =
  await fetch(

    "/admin/clients",

    {
      headers:{
        Authorization:
        `Bearer ${token}`
      }
    }

  );

  const data =
  await response.json();

  const clientsDiv =
  document.getElementById(
    "clientsList"
  );

  clientsDiv.innerHTML = "";

  data.clients.forEach(client=>{

   clientsDiv.innerHTML += `

      <div
      class="client-card"
      style="
      padding:15px;
      margin-bottom:10px;
      border-radius:12px;
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.06);
      ">

 <b>📱 ${client.number}</b>

<br><br>

<div style="
padding:8px 12px;
display:inline-block;
border-radius:999px;
background:rgba(0,255,170,0.15);
margin-bottom:12px;
font-weight:700;
">

${client.status || "Novo"}

</div>

<button
onclick="changeStatus('${client.number}')"
style="
padding:8px 14px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:700;
background:#3b82f6;
color:white;
margin-bottom:12px;
"
>
Alterar Status
</button>

<br>

<br>

<small>

${client.memory || "Sem histórico"}

</small>
      </div>

    `;

  });

}
loadAnalytics();

loadProducts();

loadClients();

loadMessagesHistory();
 
function filterClients(){

  const input =
  document.getElementById(
    "searchClient"
  );

  const filter =
  input.value.toLowerCase();

  const clients =
  document.querySelectorAll(
    ".client-card"
  );

  clients.forEach(client=>{

    const text =
    client.innerText.toLowerCase();

    if(
      text.includes(filter)
    ){

      client.style.display =
      "block";

    }else{

      client.style.display =
      "none";

    }

  });

}
async function changeStatus(number){

  const status =
  prompt(
    "Novo status:\n\nNovo\nInteressado\nNegociação\nComprou\nPerdido"
  );

  if(!status){
    return;
  }

  await fetch(

    "/admin/clients/status",

    {

      method:"PUT",

      headers:{

        "Content-Type":
        "application/json",

        Authorization:
        `Bearer ${token}`

      },

      body:JSON.stringify({

        number,
        status

      })

    }

  );

  loadClients();

}
 
</script>

</body>
</html>
