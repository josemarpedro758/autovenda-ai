<!DOCTYPE html>
<html lang="pt">
<head>

<meta charset="UTF-8"/>
<meta name="viewport"
content="width=device-width, initial-scale=1.0"/>

<title>AutoVenda IA</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Inter',sans-serif;
background:#050816;
color:white;
display:flex;
min-height:100vh;

}

.sidebar{

width:260px;
height:100vh;

background:
rgba(255,255,255,0.04);

backdrop-filter:blur(20px);

border-right:
1px solid rgba(255,255,255,0.05);

padding:25px;

position:fixed;

}

.logo{

font-size:28px;
font-weight:700;

margin-bottom:50px;

background:
linear-gradient(
90deg,
#7c3aed,
#06b6d4
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

}

.sidebar button{

width:100%;
padding:16px;

margin-bottom:12px;

border:none;
border-radius:16px;

background:
rgba(255,255,255,0.05);

color:white;

font-size:15px;
font-weight:500;

cursor:pointer;

transition:0.3s;

}

.sidebar button:hover{

background:
rgba(255,255,255,0.1);

transform:translateY(-2px);

}

.logout{

margin-top:30px;

background:
linear-gradient(
135deg,
#ef4444,
#dc2626
)!important;

}

.main{

margin-left:260px;
width:100%;
padding:30px;

}

.topbar{

display:flex;
justify-content:space-between;
align-items:center;

margin-bottom:30px;

}

.topbar h1{

font-size:34px;
font-weight:700;

}

.topbar p{

margin-top:8px;
color:#94a3b8;

}

.profile{

width:50px;
height:50px;

border-radius:50%;

background:
linear-gradient(
135deg,
#7c3aed,
#06b6d4
);

display:flex;
align-items:center;
justify-content:center;

font-weight:700;

}

.stats{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(240px,1fr));

gap:20px;

margin-bottom:30px;

}

.card{

background:
rgba(255,255,255,0.04);

padding:25px;

border-radius:24px;

border:
1px solid rgba(255,255,255,0.05);

backdrop-filter:blur(20px);

}

.card span{

font-size:14px;
color:#94a3b8;

}

.card h2{

font-size:42px;
margin-top:10px;

}

.section{

background:
rgba(255,255,255,0.04);

padding:25px;

border-radius:24px;

border:
1px solid rgba(255,255,255,0.05);

margin-bottom:25px;

backdrop-filter:blur(20px);

}

.section h2{

margin-bottom:20px;

}

input,
textarea{

width:100%;

padding:18px;

margin-bottom:15px;

border:none;
outline:none;

border-radius:18px;

background:
rgba(255,255,255,0.05);

color:white;

font-size:15px;

border:
1px solid rgba(255,255,255,0.05);

}

textarea{

min-height:120px;
resize:none;

}

input[type="file"]{

padding:14px;

}

.add-btn{

width:100%;
padding:18px;

border:none;
border-radius:18px;

background:
linear-gradient(
135deg,
#7c3aed,
#06b6d4
);

color:white;

font-size:16px;
font-weight:600;

cursor:pointer;

transition:0.3s;

}

.add-btn:hover{

transform:translateY(-2px);

opacity:0.95;

}

.product{

background:
rgba(255,255,255,0.03);

padding:20px;

border-radius:20px;

margin-top:20px;

border:
1px solid rgba(255,255,255,0.04);

}

.product img{

width:120px;
border-radius:16px;

margin-top:15px;

}

.product h3{

font-size:22px;
margin-bottom:10px;

}

.product p{

margin-top:8px;
color:#cbd5e1;

}

.delete-btn{

margin-top:15px;

padding:12px 18px;

border:none;
border-radius:12px;

background:
linear-gradient(
135deg,
#ef4444,
#dc2626
);

color:white;

cursor:pointer;

font-weight:600;

}

@media(max-width:900px){

body{

flex-direction:column;

}

.sidebar{

width:100%;
height:auto;
position:relative;

}

.main{

margin-left:0;

}

}

</style>

</head>

<body>

<div class="sidebar">

<div class="logo">
AutoVenda IA
</div>

<button>
📊 Dashboard
</button>

<button>
🛍 Produtos
</button>

<button class="logout"
onclick="logout()">
🚪 Sair
</button>

</div>

<div class="main">

<div class="topbar">

<div>

<h1>
Dashboard
</h1>

<p>
Gerencie seus produtos com IA premium.
</p>

</div>

<div class="profile">
AI
</div>

</div>

<div class="stats">

<div class="card">

<span>Total Produtos</span>

<h2 id="totalProducts">
0
</h2>

</div>

</div>

<div class="section">

<h2>
Adicionar Produto
</h2>

<input
type="text"
id="name"
placeholder="Nome do produto"
/>

<input
type="text"
id="price"
placeholder="Preço"
/>

<textarea
id="description"
placeholder="Descrição do produto"
></textarea>

<input
type="file"
id="image"
/>

<button
class="add-btn"
onclick="addProduct()"
>

Adicionar Produto

</button>

</div>

<div class="section">

<h2>
Produtos
</h2>

<div id="products"></div>

</div>

</div>

<script>

const API_URL =
"https://autovenda-ai.onrender.com";

const token =
localStorage.getItem("token");

if(!token){

window.location.href =
"/login.html";

}

async function loadProducts(){

const response = await fetch(

API_URL + "/admin/products",

{
headers:{
Authorization:
"Bearer " + token
}
}

);

const products =
await response.json();

document.getElementById(
"totalProducts"
).innerText =
products.length;

const productsDiv =
document.getElementById(
"products"
);

productsDiv.innerHTML = "";

products.forEach(product=>{

productsDiv.innerHTML += `

<div class="product">

<h3>
${product.name}
</h3>

<p>
${product.price}
</p>

<p>
${product.description}
</p>

<img src="${product.image}" />

<br>

<button
class="delete-btn"
onclick="deleteProduct(${product.id})"
>

Apagar

</button>

</div>

`;

});

}

async function addProduct(){

const name =
document.getElementById(
"name"
).value;

const price =
document.getElementById(
"price"
).value;

const description =
document.getElementById(
"description"
).value;

const imageFile =
document.getElementById(
"image"
).files[0];

const formData =
new FormData();

formData.append(
"image",
imageFile
);

const uploadResponse =
await fetch(

API_URL + "/upload-image",

{
method:"POST",
body:formData
}

);

const uploadData =
await uploadResponse.json();

const image =
uploadData.url;

await fetch(

API_URL + "/admin/products",

{

method:"POST",

headers:{

"Content-Type":
"application/json",

Authorization:
"Bearer " + token

},

body:JSON.stringify({

name,
price,
description,
image

})

}

);

document.getElementById(
"name"
).value = "";

document.getElementById(
"price"
).value = "";

document.getElementById(
"description"
).value = "";

document.getElementById(
"image"
).value = "";

loadProducts();

}

async function deleteProduct(id){

await fetch(

API_URL +
"/admin/products/" +
id,

{

method:"DELETE",

headers:{
Authorization:
"Bearer " + token
}

}

);

loadProducts();

}

function logout(){

localStorage.removeItem(
"token"
);

window.location.href =
"/login.html";

}

loadProducts();

</script>

</body>
</html>
</body>
</html>
