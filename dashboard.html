<!DOCTYPE html>
<html lang="pt">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard • AutoVenda IA</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{

background:
linear-gradient(
135deg,
#050816,
#0f172a,
#111827
);

color:white;

overflow-x:hidden;

display:flex;

min-height:100vh;

}

.sidebar{

width:270px;

background:rgba(255,255,255,0.04);

backdrop-filter:blur(20px);

border-right:
1px solid rgba(255,255,255,0.05);

padding:30px;

display:flex;
flex-direction:column;

}

.logo{

font-size:28px;
font-weight:900;

margin-bottom:50px;

background:
linear-gradient(
90deg,
#7c3aed,
#06b6d4,
#00ffbf
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

}

.menu{

display:flex;
flex-direction:column;
gap:16px;

}

.menu a{

text-decoration:none;
color:#cbd5e1;

padding:16px 18px;

border-radius:18px;

transition:0.3s;

font-weight:600;

}

.menu a:hover{

background:rgba(255,255,255,0.08);

color:white;

transform:translateX(4px);

}

.main{

flex:1;

padding:40px;

}

.topbar{

display:flex;
justify-content:space-between;
align-items:center;

margin-bottom:35px;

}

.title h1{

font-size:42px;
font-weight:900;

margin-bottom:10px;

}

.title p{

color:#94a3b8;

}

.top-actions{

display:flex;
gap:15px;

}

.button{

border:none;

padding:14px 22px;

border-radius:16px;

font-weight:700;

cursor:pointer;

transition:0.3s;

}

.primary{

background:
linear-gradient(
90deg,
#7c3aed,
#06b6d4
);

color:white;

box-shadow:
0 10px 30px rgba(124,58,237,0.35);

}

.secondary{

background:rgba(255,255,255,0.08);

color:white;

}

.button:hover{

transform:translateY(-3px);

}

.cards{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(250px,1fr));

gap:25px;

margin-bottom:35px;

}

.card{

background:rgba(255,255,255,0.05);

border:
1px solid rgba(255,255,255,0.06);

backdrop-filter:blur(18px);

padding:28px;

border-radius:28px;

transition:0.3s;

}

.card:hover{

transform:translateY(-6px);

}

.card h3{

font-size:15px;

color:#94a3b8;

margin-bottom:14px;

}

.card h2{

font-size:38px;

font-weight:900;

}

.content-grid{

display:grid;

grid-template-columns:2fr 1fr;

gap:28px;

}

.chart-box,
.products-box{

background:rgba(255,255,255,0.05);

border:
1px solid rgba(255,255,255,0.06);

backdrop-filter:blur(18px);

border-radius:30px;

padding:28px;

}

.chart-box h2,
.products-box h2{

margin-bottom:25px;

font-size:24px;

}

.product{

display:flex;
align-items:center;
justify-content:space-between;

padding:18px 0;

border-bottom:
1px solid rgba(255,255,255,0.05);

}

.product:last-child{

border:none;

}

.product-info{

display:flex;
align-items:center;
gap:15px;

}

.product img{

width:58px;
height:58px;

border-radius:16px;

object-fit:cover;

}

.price{

font-weight:800;

color:#00ffbf;

}

.badge{

padding:10px 14px;

background:
rgba(0,255,191,0.12);

border-radius:12px;

font-size:13px;

font-weight:700;

color:#00ffbf;

}

@media(max-width:1100px){

body{

flex-direction:column;

}

.sidebar{

width:100%;

}

.content-grid{

grid-template-columns:1fr;

}

}

</style>

</head>

<body>

<div class="sidebar">

<div class="logo">
🚀 AutoVenda IA
</div>

<div class="menu">

<a href="#">🏠 Dashboard</a>

<a href="#">📦 Produtos</a>

<a href="#">💬 Conversas</a>

<a href="#">📈 Analytics</a>

<a href="#">🤖 Inteligência IA</a>

<a href="#">⚙️ Configurações</a>

</div>

</div>

<div class="main">

<div class="topbar">

<div class="title">

<h1>
📊 Dashboard Premium
</h1>

<p>
Painel global inteligente de vendas automáticas
</p>

</div>

<div class="top-actions">

<button class="button secondary">
🌍 Global
</button>

<button class="button primary">
🚀 Upgrade IA
</button>

</div>

</div>

<div class="cards">

<div class="card">

<h3>
💰 Receita Total
</h3>

<h2 id="revenue">
0
</h2>

</div>

<div class="card">

<h3>
📦 Produtos
</h3>

<h2 id="products">
0
</h2>

</div>

<div class="card">

<h3>
👥 Clientes
</h3>

<h2 id="clients">
0
</h2>

</div>

<div class="card">

<h3>
💬 Conversas
</h3>

<h2 id="messages">
0
</h2>

</div>

</div>

<div class="content-grid">

<div class="chart-box">

<h2>
📈 Crescimento de vendas
</h2>

<canvas id="salesChart"></canvas>

</div>

<div class="products-box">

<h2>
🔥 Produtos recentes
</h2>

<div id="recentProducts">

</div>

</div>

</div>

</div>

<script>

const token =
localStorage.getItem("token");

if(!token){

window.location.href =
"/login.html";

}

async function loadAnalytics(){

try{

const response =
await fetch(

"/admin/analytics",

{
headers:{
Authorization:
`Bearer ${token}`
}
}

);

const data =
await response.json();

document.getElementById(
"revenue"
).innerText =
"$" + data.revenue;

document.getElementById(
"products"
).innerText =
data.products;

document.getElementById(
"clients"
).innerText =
data.clients;

document.getElementById(
"messages"
).innerText =
data.messages;

const productsContainer =
document.getElementById(
"recentProducts"
);

productsContainer.innerHTML = "";

data.recentProducts.forEach(product=>{

productsContainer.innerHTML += `

<div class="product">

<div class="product-info">

<img src="${product.image}">

<div>

<h4>${product.name}</h4>

<p>${product.description}</p>

</div>

</div>

<div class="price">
${product.price}
</div>

</div>

`;

});

const ctx =
document.getElementById(
"salesChart"
);

new Chart(ctx,{

type:"line",

data:{

labels:[
"Jan",
"Fev",
"Mar",
"Abr",
"Mai",
"Jun",
"Jul"
],

datasets:[{

label:"Vendas",

data:[
120,
190,
300,
500,
700,
950,
1200
],

borderWidth:4,

tension:0.4

}]

},

options:{

responsive:true,

plugins:{

legend:{

labels:{
color:"white"
}

}

},

scales:{

x:{
ticks:{
color:"white"
}
},

y:{
ticks:{
color:"white"
}
}

}

}

});

}catch(error){

console.log(error);

}

}

loadAnalytics();

</script>

</body>
</html>
