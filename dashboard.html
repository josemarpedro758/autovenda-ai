<!DOCTYPE html>
<html lang="pt">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>AutoVenda IA</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Inter',sans-serif;
background:#050816;
color:white;
display:flex;
min-height:100vh;
overflow-x:hidden;

}

.sidebar{

width:260px;
background:rgba(255,255,255,0.04);
backdrop-filter:blur(20px);
border-right:1px solid rgba(255,255,255,0.05);

padding:30px 20px;
position:fixed;
height:100vh;

}

.logo{

font-size:24px;
font-weight:700;
margin-bottom:50px;

background:linear-gradient(
90deg,
#7c3aed,
#06b6d4
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

}

.menu button{

width:100%;
padding:16px;
margin-bottom:12px;

background:rgba(255,255,255,0.05);

border:none;
border-radius:16px;

color:white;
font-size:15px;
font-weight:500;

cursor:pointer;
transition:0.3s;

}

.menu button:hover{

background:rgba(255,255,255,0.1);
transform:translateY(-2px);

}

.main{

margin-left:260px;
padding:30px;
width:100%;

}

.topbar{

display:flex;
justify-content:space-between;
align-items:center;

margin-bottom:30px;

}

.topbar h1{

font-size:32px;
font-weight:700;

}

.topbar p{

color:#94a3b8;
margin-top:8px;

}

.profile{

width:50px;
height:50px;
border-radius:50%;

background:linear-gradient(
135deg,
#7c3aed,
#06b6d4
);

display:flex;
align-items:center;
justify-content:center;

font-weight:700;

}

.stats{

display:grid;
grid-template-columns:
repeat(auto-fit,minmax(250px,1fr));

gap:20px;
margin-bottom:30px;

}

.card{

background:rgba(255,255,255,0.05);

border:1px solid rgba(255,255,255,0.06);

backdrop-filter:blur(20px);

padding:25px;
border-radius:24px;

transition:0.3s;

}

.card:hover{

transform:translateY(-5px);

border-color:
rgba(124,58,237,0.5);

}

.card span{

font-size:14px;
color:#94a3b8;

}

.card h2{

font-size:42px;
margin-top:10px;

}

.section{

background:rgba(255,255,255,0.04);

border:1px solid rgba(255,255,255,0.05);

backdrop-filter:blur(20px);

padding:25px;
border-radius:24px;

margin-bottom:25px;

}

.section h3{

font-size:20px;
margin-bottom:20px;

}

.item{

background:rgba(255,255,255,0.03);

padding:18px;
border-radius:18px;

margin-bottom:15px;

border:1px solid rgba(255,255,255,0.04);

}

.item img{

width:90px;
border-radius:14px;
margin-top:10px;

}

.item strong{

font-size:18px;

}

.logout{

margin-top:40px;
background:linear-gradient(
135deg,
#ef4444,
#dc2626
)!important;

}

@media(max-width:900px){

.sidebar{

width:100%;
height:auto;
position:relative;

}

.main{

margin-left:0;

}

body{

flex-direction:column;

}

}

</style>

</head>

<body>

<div class="sidebar">

<div class="logo">
AutoVenda IA
</div>

<div class="menu">

<button>
📊 Dashboard
</button>

<button>
🛍 Produtos
</button>

<button>
👥 Clientes
</button>

<button>
📈 Analytics
</button>

<button class="logout"
onclick="logout()">
🚪 Sair
</button>

</div>

</div>

<div class="main">

<div class="topbar">

<div>

<h1>
Dashboard
</h1>

<p>
Bem-vindo ao painel premium da AutoVenda IA
</p>

</div>

<div class="profile">
AI
</div>

</div>

<div class="stats">

<div class="card">

<span>Total Produtos</span>

<h2 id="totalProducts">
0
</h2>

</div>

<div class="card">

<span>Total Clientes</span>

<h2 id="totalClients">
0
</h2>

</div>

</div>

<div class="section">

<h3>
Produtos
</h3>

<div id="products"></div>

</div>

<div class="section">

<h3>
Clientes
</h3>

<div id="clients"></div>

</div>

</div>

<script>

const API_URL =
"https://autovenda-ai.onrender.com";

const token =
localStorage.getItem("token");

if(!token){

window.location.href =
"/login.html";

}

async function loadProducts(){

const response = await fetch(

API_URL + "/admin/products",

{
headers:{
Authorization:
"Bearer " + token
}
}

);

const products =
await response.json();

document.getElementById(
"totalProducts"
).innerText =
products.length;

const productsDiv =
document.getElementById(
"products"
);

productsDiv.innerHTML = "";

products.forEach(product=>{

productsDiv.innerHTML += `

<div class="item">

<strong>
${product.name}
</strong>

<p>
${product.price}
</p>

<p>
${product.description}
</p>

<img src="${product.image}" />

</div>

`;

});

}

async function loadClients(){

const response = await fetch(

API_URL + "/admin/clients",

{
headers:{
Authorization:
"Bearer " + token
}
}

);

const clients =
await response.json();

document.getElementById(
"totalClients"
).innerText =
clients.length;

const clientsDiv =
document.getElementById(
"clients"
);

clientsDiv.innerHTML = "";

clients.forEach(client=>{

clientsDiv.innerHTML += `

<div class="item">

<p>
<strong>Número:</strong>
${client.number}
</p>

<p>
<strong>Última mensagem:</strong>
${client.lastMessage}
</p>

</div>

`;

});

}

function logout(){

localStorage.removeItem(
"token"
);

window.location.href =
"/login.html";

}

loadProducts();
loadClients();

</script>

</body>
</html>
