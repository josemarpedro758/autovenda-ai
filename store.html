<!DOCTYPE html>
<html lang="pt">
<head>

<meta charset="UTF-8"/>
<meta name="viewport"
content="width=device-width, initial-scale=1.0"/>

<title>AutoVenda IA Store</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Inter',sans-serif;
background:#050816;
color:white;

}

header{

padding:30px;

display:flex;
justify-content:space-between;
align-items:center;

border-bottom:
1px solid rgba(255,255,255,0.05);

background:
rgba(255,255,255,0.03);

backdrop-filter:blur(20px);

position:sticky;
top:0;
z-index:100;

}

.logo{

font-size:28px;
font-weight:700;

background:
linear-gradient(
90deg,
#7c3aed,
#06b6d4
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

}

.hero{

padding:80px 30px;
text-align:center;

}

.hero h1{

font-size:64px;
font-weight:700;

max-width:900px;
margin:auto;

line-height:1.1;

}

.hero p{

margin-top:20px;

font-size:20px;
color:#94a3b8;

}

.products{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(300px,1fr));

gap:25px;

padding:30px;

}

.product{

background:
rgba(255,255,255,0.04);

border:
1px solid rgba(255,255,255,0.05);

border-radius:28px;

overflow:hidden;

transition:0.3s;

backdrop-filter:blur(20px);

}

.product:hover{

transform:translateY(-6px);

}

.product img{

width:100%;
height:280px;

object-fit:cover;

}

.product-content{

padding:25px;

}

.product h2{

font-size:24px;
margin-bottom:10px;

}

.product p{

color:#cbd5e1;
margin-top:10px;

line-height:1.6;

}

.price{

font-size:28px;
font-weight:700;

margin-top:20px;

}

.buy-btn{

width:100%;
padding:18px;

margin-top:20px;

border:none;
border-radius:18px;

background:
linear-gradient(
135deg,
#22c55e,
#16a34a
);

color:white;

font-size:16px;
font-weight:600;

cursor:pointer;

transition:0.3s;

}

.buy-btn:hover{

transform:translateY(-2px);

}

footer{

padding:40px;
text-align:center;

color:#64748b;

}

</style>

</head>

<body>

<header>

<div class="logo">
AutoVenda IA
</div>

</header>

<section class="hero">

<h1>

A nova geração de compras online no Mundo.

</h1>

<p>

Produtos premium com atendimento inteligente no WhatsApp.

</p>

</section>

<section class="products"
id="products">

</section>

<footer>

AutoVenda IA © 2026

</footer>

<script>

const API_URL =
"https://autovenda-ai.onrender.com";

async function loadProducts(){

const response =
await fetch(

API_URL + "/admin/products",

{

headers:{
Authorization:
"Bearer " +
localStorage.getItem("token")
}

}

);

const products =
await response.json();

const productsDiv =
document.getElementById(
"products"
);

productsDiv.innerHTML = "";

products.forEach(product=>{

productsDiv.innerHTML += `

<div class="product">

<img src="${product.image}" />

<div class="product-content">

<h2>
${product.name}
</h2>

<p>
${product.description}
</p>

<div class="price">
${product.price}
</div>

<button
class="buy-btn"
onclick="buyProduct('${product.name}')"
>

Comprar no WhatsApp

</button>

</div>

</div>

`;

});

}

function buyProduct(name){

const number =
"244900000000";

const message =
encodeURIComponent(

"Olá, tenho interesse no produto: " + name

);

window.open(

"https://wa.me/" +
number +
"?text=" +
message,

"_blank"

);

}

loadProducts();

</script>

</body>
</html>
