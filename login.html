<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login • AutoVenda IA</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{

min-height:100vh;

display:flex;

background:
linear-gradient(
135deg,
#020617,
#0f172a,
#111827
);

overflow:hidden;

}

.left{

flex:1;

background-image:
url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f?q=80&w=1600&auto=format&fit=crop');

background-size:cover;
background-position:center;

position:relative;

display:flex;
align-items:flex-end;

padding:60px;

}

.overlay{

position:absolute;

inset:0;

background:
linear-gradient(
180deg,
rgba(2,6,23,0.2),
rgba(2,6,23,0.85)
);

}

.left-content{

position:relative;

z-index:2;

max-width:600px;

}

.left-content h1{

font-size:58px;

line-height:1.1;

margin-bottom:20px;

font-weight:900;

color:white;

}

.gradient{

background:
linear-gradient(
90deg,
#7c3aed,
#06b6d4,
#00ffbf
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

}

.left-content p{

font-size:20px;

line-height:1.8;

color:#cbd5e1;

}

.right{

width:520px;

display:flex;
align-items:center;
justify-content:center;

padding:40px;

}

.login-box{

width:100%;

background:
rgba(255,255,255,0.05);

border:
1px solid rgba(255,255,255,0.08);

backdrop-filter:blur(20px);

padding:45px;

border-radius:35px;

box-shadow:
0 30px 80px rgba(0,0,0,0.4);

}

.logo{

font-size:34px;

font-weight:900;

margin-bottom:15px;

background:
linear-gradient(
90deg,
#7c3aed,
#06b6d4,
#00ffbf
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

}

.subtitle{

color:#94a3b8;

margin-bottom:35px;

line-height:1.6;

}

.input-group{

margin-bottom:22px;

}

.input-group label{

display:block;

margin-bottom:10px;

font-weight:600;

color:#e2e8f0;

}

.input{

width:100%;

padding:18px;

border:none;

outline:none;

border-radius:18px;

background:
rgba(255,255,255,0.08);

color:white;

font-size:16px;

}

.input::placeholder{

color:#94a3b8;

}

.button{

width:100%;

padding:18px;

border:none;

border-radius:18px;

font-size:17px;

font-weight:800;

cursor:pointer;

background:
linear-gradient(
90deg,
#7c3aed,
#06b6d4
);

color:white;

margin-top:15px;

transition:0.3s;

}

.button:hover{

transform:translateY(-4px);

}

.error{

margin-top:18px;

color:#ff6b6b;

font-weight:600;

}

.footer{

margin-top:28px;

text-align:center;

color:#94a3b8;

font-size:14px;

}

@media(max-width:1100px){

.left{

display:none;

}

.right{

width:100%;

}

}

</style>

</head>

<body>

<div class="left">

<div class="overlay"></div>

<div class="left-content">

<h1>

Venda com
<span class="gradient">
Inteligência Artificial
</span>

em escala global.

</h1>

<p>

Automatize vendas, converse em tempo real, analise clientes e transforme o WhatsApp numa máquina de vendas profissional.

</p>

</div>

</div>

<div class="right">

<div class="login-box">

<div class="logo">
🚀 AutoVenda IA
</div>

<div class="subtitle">

Entre na plataforma premium inteligente de vendas automáticas.

</div>

<form id="loginForm">

<div class="input-group">

<label>
📧 Email
</label>

<input
type="email"
class="input"
id="email"
placeholder="Digite seu email"
required
>

</div>

<div class="input-group">

<label>
🔒 Senha
</label>

<input
type="password"
class="input"
id="password"
placeholder="Digite sua senha"
required
>

</div>

<button class="button" type="submit">
🚀 Entrar Plataforma
</button>

<div class="error" id="error"></div>

</form>

<div class="footer">

© 2026 AutoVenda IA

</div>

</div>

</div>

<script>

const form =
document.getElementById("loginForm");

form.addEventListener(
"submit",
async(e)=>{

e.preventDefault();

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

const response =
await fetch("/login",{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
email,
password
})

});

const data =
await response.json();

if(data.success){

localStorage.setItem(
"token",
data.token
);

window.location.href =
"/dashboard";

}else{

document.getElementById(
"error"
).innerText =
"Credenciais inválidas";

}

}
);

</script>

</body>
</html>
