<!DOCTYPE html>
<html lang="pt">
<head>

<meta charset="UTF-8" />
<meta name="viewport"
content="width=device-width, initial-scale=1.0"/>

<title>AutoVenda IA Login</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Inter',sans-serif;
height:100vh;
overflow:hidden;
background:#050816;
display:flex;

}

.left{

flex:1;
position:relative;
overflow:hidden;

}

.left img{

width:100%;
height:100%;
object-fit:cover;

filter:brightness(0.7);

}

.overlay{

position:absolute;
inset:0;

background:
linear-gradient(
135deg,
rgba(124,58,237,0.6),
rgba(6,182,212,0.4)
);

display:flex;
flex-direction:column;
justify-content:flex-end;

padding:60px;

}

.overlay h1{

font-size:56px;
line-height:1.1;
font-weight:700;

margin-bottom:20px;

color:white;

max-width:600px;

}

.overlay p{

font-size:18px;
color:rgba(255,255,255,0.8);

max-width:500px;
line-height:1.6;

}

.right{

width:480px;

background:
rgba(255,255,255,0.04);

backdrop-filter:blur(25px);

border-left:
1px solid rgba(255,255,255,0.05);

display:flex;
justify-content:center;
align-items:center;

padding:40px;

}

.login-box{

width:100%;
max-width:360px;

}

.logo{

font-size:32px;
font-weight:700;

margin-bottom:10px;

background:
linear-gradient(
90deg,
#7c3aed,
#06b6d4
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

}

.subtitle{

color:#94a3b8;
margin-bottom:40px;
line-height:1.6;

}

.input-group{

margin-bottom:20px;

}

.input-group label{

display:block;
margin-bottom:10px;

font-size:14px;
color:#cbd5e1;

}

.input-group input{

width:100%;
padding:18px;

border:none;
outline:none;

border-radius:18px;

background:
rgba(255,255,255,0.05);

color:white;
font-size:15px;

border:
1px solid rgba(255,255,255,0.06);

transition:0.3s;

}

.input-group input:focus{

border-color:#7c3aed;
box-shadow:
0 0 20px rgba(124,58,237,0.3);

}

.login-btn{

width:100%;
padding:18px;

border:none;
border-radius:18px;

background:
linear-gradient(
135deg,
#7c3aed,
#06b6d4
);

color:white;

font-size:16px;
font-weight:600;

cursor:pointer;
transition:0.3s;

margin-top:10px;

}

.login-btn:hover{

transform:translateY(-2px);

opacity:0.9;

}

#error{

margin-top:20px;
color:#ef4444;

font-size:14px;

}

.footer{

margin-top:30px;
color:#64748b;

font-size:13px;
text-align:center;

}

@media(max-width:1000px){

.left{

display:none;

}

.right{

width:100%;

}

body{

background:
url('https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=2070');

background-size:cover;
background-position:center;

}

}

</style>

</head>

<body>

<div class="left">

<img
src="https://images.unsplash.com/photo-1556740749-887f6717d7e4?q=80&w=2070"
>

<div class="overlay">

<h1>
Automatize suas vendas com IA.
</h1>

<p>

Transforme o WhatsApp em uma máquina automática de vendas com inteligência artificial premium.

</p>

</div>

</div>

<div class="right">

<div class="login-box">

<div class="logo">
AutoVenda IA
</div>

<div class="subtitle">

Acesse seu painel inteligente de automação e vendas.

</div>

<div class="input-group">

<label>
Email
</label>

<input
type="email"
id="email"
placeholder="admin@autovendaia.com"
/>

</div>

<div class="input-group">

<label>
Senha
</label>

<input
type="password"
id="password"
placeholder="••••••••"
/>

</div>

<button
class="login-btn"
onclick="login()"
>

Entrar no painel

</button>

<div id="error"></div>

<div class="footer">

AutoVenda IA © 2026

</div>

</div>

</div>

<script>

const API_URL =
"https://autovenda-ai.onrender.com";

async function login(){

const email =
document.getElementById(
"email"
).value;

const password =
document.getElementById(
"password"
).value;

const response = await fetch(

API_URL + "/login",

{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
email,
password
})

}

);

const data =
await response.json();

if(data.success){

localStorage.setItem(
"token",
data.token
);

window.location.href =
"/dashboard.html";

}else{

document.getElementById(
"error"
).innerText =
"Email ou senha inválidos";

}

}

</script>

</body>
</html>

}

</script>

</body>
</html>
